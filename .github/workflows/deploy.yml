name: CI/CD Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ===== CI 环节：构建验证 =====
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 网关契约和 API 语法检查
        run: |
          node scripts/check-gateway-contract.mjs .
          find web/api -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m compileall -q server/scripts/GEO

      - name: 安装前端依赖并构建
        run: |
          cd web
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

  # ===== CD 环节：部署 =====
  deploy:
    needs: build  # ← 构建通过后才部署
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: bash $HOME/bin/deploy.sh geo-xhs
