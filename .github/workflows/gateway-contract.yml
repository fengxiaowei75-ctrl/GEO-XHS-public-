name: CI Gateway Contract
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gateway-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check gateway manifest
        run: node scripts/check-gateway-contract.mjs .
      - name: Check no direct provider usage
        run: node scripts/check-no-provider-direct.mjs .
      - name: Check serverless API syntax
        run: find web/api -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Run web unit tests
        run: npm --prefix web test
      - name: Compile Python workers
        run: python3 -m compileall -q server/scripts/GEO
