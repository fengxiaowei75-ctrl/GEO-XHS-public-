name: Gateway Contract
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gateway-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check gateway manifest
        run: node scripts/check-gateway-contract.mjs .

